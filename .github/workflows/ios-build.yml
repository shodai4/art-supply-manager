name: iOS Build & TestFlight

# 画材管理（com.shodai4.artsupplymanager / App Store Connect Apple ID 6835244770）
# Mac が無くても GitHub の macOS ランナーで署名してTestFlightへ配信する。
#
# 必要な GitHub Secrets（4つ）:
#   APPLE_TEAM_ID                  … Apple Developer のチームID（10桁）
#   APP_STORE_CONNECT_ISSUER_ID    … App Store Connect API キーの Issuer ID
#   APP_STORE_CONNECT_KEY_ID       … API キーの Key ID
#   APP_STORE_CONNECT_PRIVATE_KEY  … API キーの .p8 の中身（BEGIN PRIVATE KEY 行を含む）
# 4つが揃っていないときは、署名なしのクリーンビルド検証まで（失敗はさせない）。

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app.js'
      - 'core.js'
      - 'links.js'
      - 'pro.js'
      - 'images.js'
      - 'shops.js'
      - 'scanner.js'
      - 'jan-*.js'
      - 'jan-extra.json'
      - 'styles.css'
      - 'privacy.html'
      - 'support.html'
      - 'icon*.png'
      - 'icon.svg'
      - 'manifest.webmanifest'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**'
      - 'resources/**'
      - 'vendor/**'
      - '.github/workflows/ios-build.yml'

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_NAME: 画材管理
  BUNDLE_ID: com.shodai4.artsupplymanager
  MARKETING_VERSION: '1.0'

jobs:
  build-ios:
    name: Build iOS App with Xcode on macOS
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Python (v3.11)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies for Asset Generation
        run: |
          python3 -m pip install --upgrade pip
          pip install Pillow

      - name: Install NPM Dependencies
        run: |
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Run Unit Tests
        run: npm test

      - name: Generate App Icon and Splash (Pillow, no fonts)
        run: python3 scripts/generate-ios-assets.py

      - name: Build Web Assets into www/
        run: npm run build

      - name: Check Xcode and CocoaPods
        run: |
          xcodebuild -version
          pod --version

      - name: Initialize or Sync Capacitor iOS Project
        run: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi
          npx cap sync ios
          node scripts/configure-ios.mjs
          node scripts/setup-ios-assets.mjs

      - name: Install Pods
        run: |
          cd ios/App
          pod install
          test -f Podfile.lock

      - name: Verify Info.plist, Icons and Web Assets
        run: |
          set -euo pipefail
          PLIST=ios/App/App/Info.plist
          grep -q "<string>${APP_NAME}</string>" "$PLIST"
          grep -q '<key>NSCameraUsageDescription</key>' "$PLIST"
          grep -q '<key>NSPhotoLibraryUsageDescription</key>' "$PLIST"
          grep -A1 '<key>ITSAppUsesNonExemptEncryption</key>' "$PLIST" | grep -q '<false/>'
          grep -q '<key>UISupportedInterfaceOrientations</key>' "$PLIST"
          test -f ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-1024x1024@1x.png
          test -f www/index.html
          test -f www/links.js
          test -f www/vendor/html5-qrcode.min.js
          /usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$PLIST" || true

      - name: Clean and Compile iOS App (Xcode Verification, no signing)
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            clean build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Check App Store Connect API Key and Release Status
        id: check_keys
        env:
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          MISSING=""
          if [ -z "$PRIVATE_KEY" ]; then MISSING="$MISSING APP_STORE_CONNECT_PRIVATE_KEY"; fi
          if [ -z "$KEY_ID" ]; then MISSING="$MISSING APP_STORE_CONNECT_KEY_ID"; fi
          if [ -z "$ISSUER_ID" ]; then MISSING="$MISSING APP_STORE_CONNECT_ISSUER_ID"; fi
          if [ -z "$TEAM_ID" ]; then MISSING="$MISSING APPLE_TEAM_ID"; fi
          if [ -z "$MISSING" ]; then
            echo "has_keys=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_keys=false" >> "$GITHUB_OUTPUT"
            echo "Signing secrets missing:$MISSING (clean build verification only)"
          fi

      - name: Install App Store Connect API Key (.p8)
        if: steps.check_keys.outputs.has_keys == 'true'
        env:
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$KEY_DIR"
          KEY_PATH="$KEY_DIR/AuthKey_${KEY_ID}.p8"
          printf '%s\n' "$PRIVATE_KEY" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          printf '%s\n' "$PRIVATE_KEY" > "$RUNNER_TEMP/AuthKey_${KEY_ID}.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey_${KEY_ID}.p8"
          echo "KEY_PATH=$RUNNER_TEMP/AuthKey_${KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Archive iOS App (unsigned archive, cloud signing at export)
        if: steps.check_keys.outputs.has_keys == 'true'
        run: |
          cd ios/App
          rm -rf "$RUNNER_TEMP/ArtSupplyManager.xcarchive"
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/ArtSupplyManager.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "${{ secrets.APP_STORE_CONNECT_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}" \
            archive \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Generate ExportOptions.plist
        if: steps.check_keys.outputs.has_keys == 'true'
        run: |
          {
            echo '<?xml version="1.0" encoding="UTF-8"?>'
            echo '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">'
            echo '<plist version="1.0">'
            echo '<dict>'
            echo '  <key>method</key>'
            echo '  <string>app-store-connect</string>'
            echo '  <key>teamID</key>'
            echo '  <string>${{ secrets.APPLE_TEAM_ID }}</string>'
            echo '  <key>signingStyle</key>'
            echo '  <string>automatic</string>'
            echo '  <key>destination</key>'
            echo '  <string>export</string>'
            echo '  <key>manageAppVersionAndBuildNumber</key>'
            echo '  <true/>'
            echo '  <key>uploadSymbols</key>'
            echo '  <true/>'
            echo '  <key>stripSwiftSymbols</key>'
            echo '  <true/>'
            echo '</dict>'
            echo '</plist>'
          } > "$RUNNER_TEMP/ExportOptions.plist"
          plutil -lint "$RUNNER_TEMP/ExportOptions.plist"

      - name: Export IPA for App Store Connect
        if: steps.check_keys.outputs.has_keys == 'true'
        run: |
          rm -rf "$RUNNER_TEMP/export"
          mkdir -p "$RUNNER_TEMP/export"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/ArtSupplyManager.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "${{ secrets.APP_STORE_CONNECT_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}"

      - name: Upload IPA to TestFlight
        id: upload
        if: steps.check_keys.outputs.has_keys == 'true'
        run: |
          IPA_PATH=$(ls -1 "$RUNNER_TEMP/export/"*.ipa 2>/dev/null | head -n 1 || true)
          test -n "$IPA_PATH"
          if xcrun altool --upload-app -f "$IPA_PATH" -t ios \
               --apiKey "${{ secrets.APP_STORE_CONNECT_KEY_ID }}" \
               --apiIssuer "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}" \
               > "$RUNNER_TEMP/upload.log" 2>&1; then
            echo "upload_status=success" >> "$GITHUB_OUTPUT"
            cat "$RUNNER_TEMP/upload.log"
          else
            cat "$RUNNER_TEMP/upload.log" || true
            xcrun iTMSTransporter -m upload -assetFile "$IPA_PATH" \
              -apiKey "${{ secrets.APP_STORE_CONNECT_KEY_ID }}" \
              -apiIssuer "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}" \
              -v informational
            echo "upload_status=success_transporter" >> "$GITHUB_OUTPUT"
          fi

      # ---------------------------------------------------------------------
      # TestFlight 自動配信: アップロードしたビルドを内部テストグループ
      # （名前に「開発テスト」を含むグループ優先）へ App Store Connect API で自動追加する。
      # 処理: 処理完了(VALID)を最大15分ポーリング → 暗号化申告(null なら false)の補完
      #       → 内部グループへ追加（409=追加済み も成功）
      # スクリプト: scripts/distribute-testflight.mjs（npm test で検証済み）
      # Secret 名は ASC_* を優先し、既存の APP_STORE_CONNECT_* 名にもフォールバックする。
      # ---------------------------------------------------------------------
      - name: TestFlight 内部テストグループへ自動配信
        id: distribute
        if: steps.check_keys.outputs.has_keys == 'true' && steps.upload.outcome == 'success'
        timeout-minutes: 20
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID || secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID || secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY || secrets.APP_STORE_CONNECT_PRIVATE_KEY || secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          ASC_APP_ID: '6835244770'
          ASC_BUILD_NUMBER: ${{ github.run_number }}
          ASC_BETA_GROUP_NAME: '開発テスト'
        run: |
          # アップロードされたビルドの番号を IPA から読み取る（Xcode が自動採番した場合の保険）
          IPA_PATH=$(ls -1 "$RUNNER_TEMP/export/"*.ipa 2>/dev/null | head -n 1 || true)
          if [ -n "$IPA_PATH" ]; then
            ACTUAL=$(unzip -p "$IPA_PATH" "Payload/*.app/Info.plist" 2>/dev/null | plutil -extract CFBundleVersion raw -o - - 2>/dev/null || true)
            if [ -n "$ACTUAL" ]; then
              echo "[CI] IPA の CFBundleVersion: $ACTUAL（予定: ${ASC_BUILD_NUMBER}）"
              export ASC_BUILD_NUMBER="$ACTUAL"
            fi
          fi
          node scripts/distribute-testflight.mjs

      - name: Cleanup API Key Files
        if: always()
        run: |
          rm -rf "$HOME/.appstoreconnect/private_keys"
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8
          rm -f "$RUNNER_TEMP/upload.log" 2>/dev/null || true
