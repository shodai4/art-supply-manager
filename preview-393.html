<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><title>393px 表示確認 ｜ ガザイコ</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{margin:0;background:#dfe4ec;display:flex;gap:16px;padding:12px;font-family:sans-serif}
.frame{width:393px;height:852px;background:#fff;box-shadow:0 4px 16px rgba(0,0,0,.18);border-radius:8px;overflow:hidden}
iframe{width:393px;height:852px;border:0;display:block}
p{font-size:12px;color:#555;margin:0 0 8px}</style></head>
<body>
<!-- 使い方: preview-393.html?src=<アプリのURL>（省略時は同じフォルダの index.html）
     ローカル: preview-393.html?src=http://127.0.0.1:8080/
     GitHub Pages: https://shodai4.github.io/art-supply-manager/preview-393.html -->
<div>
  <p>393×852（iPhone 15 / 14 Pro 相当）でアプリを表示</p>
  <div class="frame"><iframe id="frame" title="ガザイコ 393px"></iframe></div>
</div>
<script>
  var q = new URLSearchParams(location.search);
  document.getElementById('frame').src = q.get('src') || './';
</script>
</body></html>
